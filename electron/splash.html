<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Voice Assistant</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: radial-gradient(circle at 50% 30%, #131722 0%, #080a0f 100%);
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-app-region: drag;
    }
    .titlebar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      -webkit-app-region: drag;
    }
    .window-controls {
      display: flex;
      gap: 8px;
      -webkit-app-region: no-drag;
    }
    .control-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.2s;
    }
    .control-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #f8fafc;
    }
    .control-btn.close:hover {
      background: #ef4444;
      color: white;
    }
    .container {
      text-align: center;
      max-width: 480px;
      padding: 30px;
      border-radius: 16px;
      background: rgba(18, 24, 38, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.15);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 40px rgba(34, 211, 238, 0.08);
      -webkit-app-region: no-drag;
    }
    .orb-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .orb-pulse {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(34, 211, 238, 0.3) 0%, rgba(168, 85, 247, 0) 70%);
      animation: pulse 2s infinite ease-in-out;
    }
    .orb-core {
      position: relative;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #06b6d4, #8b5cf6);
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wave-bars {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 24px;
    }
    .bar {
      width: 4px;
      border-radius: 2px;
      background: #ffffff;
      animation: soundWave 1.2s infinite ease-in-out alternate;
    }
    .bar:nth-child(1) { height: 10px; animation-delay: 0.1s; }
    .bar:nth-child(2) { height: 18px; animation-delay: 0.25s; }
    .bar:nth-child(3) { height: 24px; animation-delay: 0.4s; }
    .bar:nth-child(4) { height: 16px; animation-delay: 0.2s; }
    .bar:nth-child(5) { height: 8px; animation-delay: 0.35s; }
    h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #f8fafc, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.status {
      font-size: 13px;
      color: #38bdf8;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
      animation: blink 1.5s infinite;
    }
    .instructions {
      font-size: 12px;
      color: #64748b;
      line-height: 1.6;
      background: rgba(15, 23, 42, 0.6);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 20px;
      text-align: left;
    }
    .instructions code {
      color: #a5f3fc;
      background: rgba(56, 189, 248, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Consolas', monospace;
    }
    .btn {
      background: linear-gradient(135deg, #0284c7, #6366f1);
      color: white;
      border: none;
      padding: 10px 24px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
    }
    .btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.9); opacity: 0.4; }
      50% { transform: scale(1.2); opacity: 0.8; }
    }
    @keyframes soundWave {
      0% { height: 6px; }
      100% { height: 26px; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="titlebar">
    <div style="font-size: 11px; font-weight: 600; color: #64748b; letter-spacing: 0.05em; text-transform: uppercase;">AI Voice Assistant Desktop</div>
    <div class="window-controls">
      <button class="control-btn" id="minBtn" title="Minimize">―</button>
      <button class="control-btn close" id="closeBtn" title="Close">✕</button>
    </div>
  </div>

  <div class="container">
    <div class="orb-wrapper">
      <div class="orb-pulse"></div>
      <div class="orb-core">
        <div class="wave-bars">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>
      </div>
    </div>

    <h1>Connecting to Voice Agent</h1>
    <p class="status" id="statusText"><span class="dot"></span> Initializing assistant core...</p>

    <div class="instructions">
      <strong>Starting Up:</strong><br>
      • Self-hosting Next.js web interface on port 6001.<br>
      • Starting Python Voice Agent and laptop control engine.<br>
      • Application will connect automatically in a few seconds.
    </div>

    <button class="btn" id="retryBtn">Retry Connection Now</button>
  </div>

  <script>
    const statusText = document.getElementById('statusText');
    const retryBtn = document.getElementById('retryBtn');
    const minBtn = document.getElementById('minBtn');
    const closeBtn = document.getElementById('closeBtn');

    minBtn.addEventListener('click', () => {
      if (window.electronAPI) window.electronAPI.minimize();
    });
    closeBtn.addEventListener('click', () => {
      if (window.electronAPI) window.electronAPI.close();
    });

    let targetUrl = 'http://localhost:6001';
    let attempts = 0;

    async function init() {
      if (window.electronAPI && window.electronAPI.getStartupInfo) {
        try {
          const info = await window.electronAPI.getStartupInfo();
          if (info && info.appUrl) {
            targetUrl = info.appUrl;
          }
        } catch (e) {}
      }
      checkServer();
    }

    async function checkServer() {
      attempts++;
      try {
        statusText.innerHTML = `<span class="dot"></span> Probing ${targetUrl}...`;
        const res = await fetch(targetUrl, { mode: 'no-cors' });
        statusText.textContent = 'Server detected! Loading application...';
        window.location.href = targetUrl;
      } catch (err) {
        if (attempts < 4) {
          statusText.innerHTML = '<span class="dot"></span> Bootstrapping local Next.js server (Port 6001)...';
        } else if (attempts < 8) {
          statusText.innerHTML = '<span class="dot"></span> Initializing Python Voice Agent & tools...';
        } else {
          statusText.innerHTML = `<span class="dot"></span> Waiting for local server (${targetUrl})...`;
        }
      }
    }

    retryBtn.addEventListener('click', checkServer);
    setInterval(checkServer, 1800);
    init();
  </script>
</body>
</html>
